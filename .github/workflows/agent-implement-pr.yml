name: Agent Implement (PR)

on:
  # See agent-review.yml — pull_request_target fires reliably on labels
  # even when the PR is out-of-date or conflicting.
  pull_request_target:
    types: [labeled]

jobs:
  implement-pr:
    if: github.event.label.name == 'agent:implement'
    runs-on: self-hosted
    timeout-minutes: 60
    # Shared with agent-review.yml — both push to the PR branch.
    concurrency:
      group: agent-mutate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_STATE: ${{ github.event.pull_request.state }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout main (shared labels module + setup-runner action)
        uses: actions/checkout@v5
        with:
          ref: main
          # Full (non-sparse) checkout: the local composite action and the shared
          # module must both be on disk before "Setup runner" runs. A sparse
          # checkout here would leave core.sparseCheckout=on in the runner's
          # primary checkout dir, poisoning the next job's plain checkout (the
          # npm-install ENOENT from #24). "Setup runner" re-checks-out the PR head
          # over this; the extra shallow main checkout is cheap insurance.

      - name: Pre-flight — refuse if PR is closed or merged
        id: state
        run: |
          if [ "$PR_STATE" != "open" ] || [ "$PR_MERGED" = "true" ]; then
            npx -y tsx .sandcastle/agent-workflows/shared/labels.ts remove-trigger-label pr "$PR_NUMBER" implement
            gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:implement\`: PR is not open."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-flight — refuse if there is nothing to act on
        if: steps.state.outputs.proceed == 'true'
        id: inputs
        run: |
          set -euo pipefail
          top_level=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments | length')
          review_summaries=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" --jq '[.[] | select(.body != null and .body != "")] | length')
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"
          unresolved=$(gh api graphql \
            -F owner="$owner" -F repo="$repo" -F number="$PR_NUMBER" \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          total=$((top_level + review_summaries + unresolved))
          if [ "$total" -eq 0 ]; then
            npx -y tsx .sandcastle/agent-workflows/shared/labels.ts remove-trigger-label pr "$PR_NUMBER" implement
            gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:implement\`: no unresolved review threads, review summaries, or top-level PR comments to act on."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Transition labels — remove trigger + blocked, add in-progress
        if: steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        run: npx -y tsx .sandcastle/agent-workflows/shared/labels.ts start-work pr "$PR_NUMBER" implement

      - name: Setup runner (checkout, branch, Node 22, deps, git identity)
        if: steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        uses: ./.github/actions/setup-runner
        with:
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Run implement-pr.ts
        if: steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        id: implement
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: npx tsx .sandcastle/agent-workflows/implement-pr/implement-pr.ts

      - name: Push branch (abort cleanly if non-fast-forward)
        if: steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true' && success()
        id: push
        run: |
          has_commits=$(cat "${RUNNER_TEMP}/has_commits.txt")
          if [ "$has_commits" != "true" ]; then
            echo "No commits this run — skipping push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "without .workflows. permission|refusing to allow a GitHub App to create or update workflow" push_err.txt; then
              echo "Push rejected: token lacks 'workflows' permission to update .github/workflows/*. Ensure checkout uses AGENT_PAT." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during implement run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Post thread replies (best-effort)
        # Best-effort + jq iteration (not `seq`): see agent-review.yml. BSD
        # `seq 0 -1` prints "0\n-1", so an empty replies file crashed this step
        # on the macOS runners and falsely marked the PR blocked.
        if: steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true' && success()
        continue-on-error: true
        env:
          REPLIES: ${{ runner.temp }}/implement_thread_replies.json
        run: |
          jq -c '.[]?' "$REPLIES" | while read -r reply; do
            commentId=$(printf '%s' "$reply" | jq -r '.commentId')
            body=$(printf '%s' "$reply" | jq -r '.body')
            { [ -z "$commentId" ] || [ "$commentId" = "null" ]; } && continue
            rest_id=$(gh api graphql -f query="query(\$id:ID!){ node(id:\$id){ ... on PullRequestReviewComment { databaseId } } }" -f id="$commentId" --jq '.data.node.databaseId' 2>/dev/null) || rest_id=""
            if [ -z "$rest_id" ] || [ "$rest_id" = "null" ]; then
              echo "Could not resolve REST id for $commentId — skipping" >&2
              continue
            fi
            gh api \
              --method POST \
              "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments/${rest_id}/replies" \
              -f body="$body" || echo "Failed to post reply to $rest_id (best-effort)" >&2
          done

      - name: Post new inline comments
        if: steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true' && success()
        continue-on-error: true
        env:
          INLINE: ${{ runner.temp }}/implement_new_inline_comments.json
        run: |
          commit_id=$(jq -r '.commit_id' "$INLINE")
          jq -c '.comments[]?' "$INLINE" | while read -r c; do
            path=$(printf '%s' "$c" | jq -r '.path')
            line=$(printf '%s' "$c" | jq -r '.line')
            side=$(printf '%s' "$c" | jq -r '.side')
            body=$(printf '%s' "$c" | jq -r '.body')
            gh api \
              --method POST \
              "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments" \
              -f body="$body" \
              -f commit_id="$commit_id" \
              -f path="$path" \
              -F line="$line" \
              -f side="$side" || echo "Failed to post inline comment on $path:$line (best-effort)" >&2
          done

      - name: Post top-level PR comments
        if: steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true' && success()
        continue-on-error: true
        env:
          TOP: ${{ runner.temp }}/implement_top_level_comments.json
        run: |
          jq -c '.[]?' "$TOP" | while read -r item; do
            body=$(printf '%s' "$item" | jq -r '.body')
            gh pr comment "$PR_NUMBER" --body "$body" || echo "Failed to post top-level comment (best-effort)" >&2
          done

      - name: Request automated re-review (chain into agent-review.yml)
        # Closes the retry loop (ADR-0004): after feedback is addressed and
        # pushed, the PR goes back through the merge gate instead of sitting
        # unlabeled. No-commit runs skip this — nothing changed to re-review.
        if: steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true' && success() && steps.push.outputs.pushed == 'true'
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: npx -y tsx .sandcastle/agent-workflows/shared/labels.ts add-trigger-label pr "$PR_NUMBER" review

      - name: Mark blocked on failure
        if: steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written — check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body=$(cat <<EOF
          \`agent:implement\` run on this PR failed.

          **Reason:** $reason

          **Workflow run:** $RUN_URL

          Re-add \`agent:implement\` to retry.
          EOF
          )
          npx -y tsx .sandcastle/agent-workflows/shared/labels.ts mark-blocked pr "$PR_NUMBER" --body "$body"

      - name: Always remove in-progress label
        if: always() && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        run: npx -y tsx .sandcastle/agent-workflows/shared/labels.ts finish pr "$PR_NUMBER"
