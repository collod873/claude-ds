name: Agent Auto-Merge

# When agent review passes and adds `ready-to-merge`, arm GitHub auto-merge so
# the PR lands only after the repo's required status checks go green (ADR-0006).
# On repos with no required checks (no ruleset, or auto-merge disallowed) the
# arm fails fast and we land the PR directly — the pre-ADR-0006 behavior.
#
# Both the arm and the direct merge run as AGENT_PAT, never GITHUB_TOKEN: the
# eventual merge fires this file's own `closed` job plus CI on main, and
# GITHUB_TOKEN-authored events never trigger workflows. The `closed` job owns
# everything that used to run inline after a synchronous merge: closing linked
# issues (authored with AGENT_PAT so `issues:closed` fires — promotion of
# dependent `agent:queued` issues stays solely with agent-promote-queued.yml,
# and the parent PRD's auto-close with agent-close-completed-prd.yml), one
# same-run PRD-close fallback (idempotent with close-completed-prd.yml), and
# re-kicking armed sibling PRs so staleness is re-checked against the new main.

on:
  pull_request_target:
    types: [labeled, closed]

jobs:
  merge:
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-merge'
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      AGENT_PAT: ${{ secrets.AGENT_PAT }}

    steps:
      - name: Checkout main (for the shared labels module)
        uses: actions/checkout@v5
        with:
          ref: main
          # Check the shared module out to a SEPARATE path so the sparse config
          # lives in _shared/.git, never the runner's primary checkout dir. A
          # sparse main checkout here used to leave core.sparseCheckout=on behind,
          # poisoning the next job's plain checkout (npm install ENOENT). See #24.
          path: _shared
          sparse-checkout: .sandcastle/agent-workflows/shared
          sparse-checkout-cone-mode: false

      - name: Arm auto-merge (or land directly)
        run: |
          set -uo pipefail
          # Decision tree: arm a mergeable, non-stale PR; hand stale/conflicting
          # ones to the rebase robot (which re-arms ready-to-merge on a real
          # rebase); briefly retry while GitHub is still computing mergeability
          # (UNKNOWN right after a push).
          #
          # We gate on `mergeable` + staleness, NOT on mergeStateStatus=CLEAN:
          # required checks are still running when this job fires (that's the
          # point of arming auto-merge), and this job's own in-progress check
          # run holds the PR at UNSTABLE anyway — so CLEAN is unreachable from
          # inside the job. Gating on CLEAN deadlocks and bounces to the rebase
          # robot forever (the merge loop).
          #
          # All merge paths use AGENT_PAT. A GITHUB_TOKEN merge suppresses the
          # `closed` event, which silently kills the whole post-merge cascade.
          if [ -n "${AGENT_PAT:-}" ]; then
            MERGE_TOKEN="$AGENT_PAT"
          else
            MERGE_TOKEN="$GH_TOKEN"
            echo "::warning::AGENT_PAT unset — merging as GITHUB_TOKEN. The closed event will NOT fire, so linked issues stay open and queued dependents are never promoted. Close them manually."
          fi
          merged=false
          rebase=false
          for attempt in 1 2 3 4 5 6; do
            data=$(gh pr view "$PR_NUMBER" --json state,mergeable,mergeStateStatus,autoMergeRequest)
            st=$(echo "$data" | jq -r '.state')
            m=$(echo "$data" | jq -r '.mergeable')
            s=$(echo "$data" | jq -r '.mergeStateStatus')
            armed=$(echo "$data" | jq -r '.autoMergeRequest != null')
            # A transient API failure leaves st empty — without this guard it
            # reads as "not OPEN" below and the job silently skips the merge,
            # eating the ready-to-merge label.
            if [ -z "$st" ]; then
              echo "gh pr view failed (API blip?); retry $attempt..."
              sleep 5
              continue
            fi
            if [ "$st" != "OPEN" ]; then
              echo "PR #$PR_NUMBER is $st — nothing to merge."
              merged=skip; break
            fi
            # Genuinely stale or conflicting → rebase robot. Check this FIRST so a
            # BEHIND/DIRTY PR is never landed or left armed.
            if [ "$m" = "CONFLICTING" ] || [ "$s" = "DIRTY" ] || [ "$s" = "BEHIND" ]; then
              echo "PR #$PR_NUMBER is stale/conflicting (mergeable=$m state=$s)."
              rebase=true; break
            fi
            # Already armed (a re-kick from the closed job, or a duplicate
            # labeled event) — GitHub lands it when the checks pass; done here.
            if [ "$armed" = "true" ]; then
              echo "Auto-merge already armed on #$PR_NUMBER — GitHub merges when required checks pass."
              merged=armed; break
            fi
            # Mergeable and not stale → arm it (UNSTABLE/HAS_HOOKS included).
            if [ "$m" = "MERGEABLE" ] && [ "$s" != "DRAFT" ]; then
              if GH_TOKEN="$MERGE_TOKEN" gh pr merge "$PR_NUMBER" --auto --squash --delete-branch; then
                echo "Auto-merge armed — GitHub merges #$PR_NUMBER when required checks pass."
                merged=armed
                break
              fi
              # --auto is rejected when the repo has no required checks to wait
              # for (no ruleset, allow_auto_merge off, or the PR is already
              # CLEAN). Land it directly — identical to the pre-ADR-0006 path.
              if GH_TOKEN="$MERGE_TOKEN" gh pr merge "$PR_NUMBER" --squash --delete-branch; then
                merged=true
                break
              fi
              # Transient API failure — re-poll and retry within the loop. A
              # real conflict shows up as CONFLICTING/DIRTY on the next poll
              # and hands off to the rebase robot as before.
              echo "gh pr merge failed; re-polling (attempt $attempt)..."
              sleep 5
              continue
            fi
            echo "Mergeability still computing (mergeable=$m state=$s); retry $attempt..."
            sleep 5
          done
          if [ "$merged" != "false" ]; then
            exit 0
          fi
          # Either a real conflict, or mergeability never settled. Hand to the
          # rebase robot. Park the approval as merge-pending-update so the PR
          # never reads ready-to-merge while it's stale/conflicting — on a real
          # rebase the robot swaps it back to ready-to-merge (a fresh labeled
          # event) and we land it on the next auto-merge pass. Use AGENT_PAT so
          # the labeled event actually triggers agent-update-branch.
          if [ "$rebase" = "false" ]; then
            echo "Mergeability never settled — handing to rebase robot to recompute."
          fi
          npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts remove-trigger-label pr "$PR_NUMBER" ready-to-merge
          npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts add-trigger-label pr "$PR_NUMBER" merge-pending-update
          npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts add-trigger-label pr "$PR_NUMBER" update-branch
          gh pr comment "$PR_NUMBER" --body "Auto-merge couldn't fast-forward (a sibling PR likely landed first) — handed to \`agent:update-branch\` to rebase. The approval is parked as \`merge-pending-update\` and flips back to \`ready-to-merge\` once the branch is current."

  # Runs when an agent-approved PR actually lands — immediately on the direct
  # path, minutes later (after required checks) on the armed path. Fires only
  # because the merge above was AGENT_PAT-authored; see the header comment.
  cascade:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'ready-to-merge')
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      AGENT_PAT: ${{ secrets.AGENT_PAT }}

    steps:
      - name: Checkout main (for the shared labels module)
        uses: actions/checkout@v5
        with:
          ref: main
          path: _shared
          sparse-checkout: .sandcastle/agent-workflows/shared
          sparse-checkout-cone-mode: false

      - name: Re-kick armed sibling PRs
        run: |
          set -euo pipefail
          # This merge moved main, so every other approved-and-waiting PR is now
          # BEHIND — or newly CONFLICTING, in which case GitHub silently disarms
          # its auto-merge with no event to catch. Cycling ready-to-merge (via
          # AGENT_PAT, so the labeled event fires) re-runs the merge job's
          # decision tree against the new main: stale siblings hand off to the
          # rebase robot exactly as the old synchronous poll did. This keeps the
          # wave draining serially instead of stalling on a disarmed PR.
          siblings=$(gh pr list --state open --label ready-to-merge --json number --jq '.[].number')
          if [ -z "$siblings" ]; then
            echo "No armed siblings to re-evaluate."
          fi
          for n in $siblings; do
            echo "Re-evaluating sibling PR #$n against the new main"
            npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts remove-trigger-label pr "$n" ready-to-merge
            npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts add-trigger-label pr "$n" ready-to-merge
          done

      - name: Close linked issues and cascade-close the parent PRD
        run: |
          set -euo pipefail
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"

          body=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          closed_issues=$(echo "$body" | grep -oiE '(closes|fixes|resolves)\s+#[0-9]+' \
            | grep -oE '[0-9]+' || true)

          if [ -z "$closed_issues" ]; then
            echo "No linked issues found."
            exit 0
          fi

          for issue in $closed_issues; do
            # GitHub's native auto-close may have beaten us here. That's fine:
            # the merge was AGENT_PAT-authored, so the native close is too, and
            # its issues:closed event already fired the downstream owners.
            state=$(gh issue view "$issue" --json state --jq '.state')
            if [ "$state" = "OPEN" ]; then
              echo "Closing #$issue"
              # Use AGENT_PAT for the close so the on-close triggers fire:
              # agent-promote-queued.yml (release dependents) and
              # agent-close-completed-prd.yml (close the parent PRD).
              # GITHUB_TOKEN closes do not trigger workflows, so the PAT close
              # is what makes those the single owners of promotion / PRD-close.
              # Falls back to GITHUB_TOKEN; in that case the event-driven
              # promotion won't fire, but the inline PRD cascade below still
              # closes the parent (promotion of dependents waits for the next
              # PAT-authored close).
              set +e
              if [ -n "${AGENT_PAT:-}" ]; then
                GH_TOKEN="$AGENT_PAT" gh issue close "$issue" --reason completed
                status=$?
                if [ "$status" -ne 0 ]; then
                  echo "AGENT_PAT close failed (status $status); falling back to GITHUB_TOKEN."
                  gh issue close "$issue" --reason completed
                fi
              else
                gh issue close "$issue" --reason completed
              fi
              set -e
            fi

            # Cascade parent-PRD close. If this issue is a sub-issue and every
            # sibling is now closed, close the parent PRD too. This duplicates
            # agent-close-completed-prd.yml (which fires on the PAT-authored
            # issues:closed above), kept as a same-run fallback against event
            # delay. Both guard on parent_state==OPEN, so they're idempotent.
            parent=$(gh api graphql \
              -f query='query($owner: String!, $repo: String!, $num: Int!) { repository(owner: $owner, name: $repo) { issue(number: $num) { parent { number } } } }' \
              -f owner="$owner" -f repo="$repo" -F num="$issue" \
              --jq '.data.repository.issue.parent.number // empty' 2>/dev/null || echo "")
            if [ -n "$parent" ]; then
              open_remaining=$(gh api "repos/${GH_REPO}/issues/${parent}/sub_issues" \
                --jq '[.[] | select(.state == "open")] | length' 2>/dev/null || echo "0")
              parent_state=$(gh issue view "$parent" --json state --jq '.state')
              if [ "$open_remaining" = "0" ] && [ "$parent_state" = "OPEN" ]; then
                echo "All sub-issues of #$parent are closed — closing the PRD."
                npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts finish issue "$parent"
                gh issue close "$parent" --comment "All sub-issues complete — closing this PRD. Implemented across parallel sub-issue PRs."
              else
                echo "Parent #$parent: $open_remaining open sub-issue(s) remaining — leaving open."
              fi
            fi

            # Promotion of dependents is intentionally NOT done here. The
            # AGENT_PAT close above fires issues:closed, which triggers
            # agent-promote-queued.yml — the single owner of that cascade.
          done
