name: Agent Auto-Merge

# When agent review passes and adds `ready-to-merge`, merge the PR
# automatically so the linked issue closes and the promote-queued
# workflow can fire for any dependent issues.

on:
  pull_request_target:
    types: [labeled]

jobs:
  merge:
    if: github.event.label.name == 'ready-to-merge'
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Merge PR
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch

      - name: Close linked issues
        if: success()
        run: |
          body=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          echo "$body" | grep -oiE '(closes|fixes|resolves)\s+#[0-9]+' \
            | grep -oE '[0-9]+' \
            | while read -r issue; do
                state=$(gh issue view "$issue" --json state --jq '.state')
                if [ "$state" = "OPEN" ]; then
                  gh issue close "$issue" --reason completed
                fi
              done
