name: Agent Auto-Merge

# When agent review passes and adds `ready-to-merge`, merge the PR,
# close linked issues, and promote any dependent `agent:queued` issues.
# This is self-contained because GITHUB_TOKEN actions don't trigger
# downstream workflows (so we can't rely on the separate promote-queued
# workflow firing from the issue close event).

on:
  pull_request_target:
    types: [labeled]

jobs:
  merge:
    if: github.event.label.name == 'ready-to-merge'
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      AGENT_PAT: ${{ secrets.AGENT_PAT }}

    steps:
      - name: Merge PR
        id: merge
        run: |
          set -uo pipefail
          # Decision tree: land a mergeable, non-stale PR; hand stale/conflicting
          # ones to the rebase robot (which re-arms ready-to-merge on a real
          # rebase); briefly retry while GitHub is still computing mergeability
          # (UNKNOWN right after a push).
          #
          # We gate on `mergeable` + staleness, NOT on mergeStateStatus=CLEAN.
          # This repo has no required PR checks — agent review is the merge gate
          # (it sets ready-to-merge) — and THIS job's own in-progress `merge`
          # check run holds the PR at UNSTABLE while we poll, so CLEAN is
          # unreachable from inside the job. Gating on CLEAN deadlocks and
          # bounces to the rebase robot forever (the merge loop).
          merged=false
          rebase=false
          for attempt in 1 2 3 4 5 6; do
            data=$(gh pr view "$PR_NUMBER" --json state,mergeable,mergeStateStatus)
            st=$(echo "$data" | jq -r '.state')
            m=$(echo "$data" | jq -r '.mergeable')
            s=$(echo "$data" | jq -r '.mergeStateStatus')
            if [ "$st" != "OPEN" ]; then
              echo "PR #$PR_NUMBER is $st — nothing to merge."
              merged=skip; break
            fi
            # Genuinely stale or conflicting → rebase robot. Check this FIRST so a
            # BEHIND/DIRTY PR is never landed.
            if [ "$m" = "CONFLICTING" ] || [ "$s" = "DIRTY" ] || [ "$s" = "BEHIND" ]; then
              echo "PR #$PR_NUMBER is stale/conflicting (mergeable=$m state=$s)."
              rebase=true; break
            fi
            # Mergeable and not stale → land it (UNSTABLE/HAS_HOOKS included).
            if [ "$m" = "MERGEABLE" ] && [ "$s" != "DRAFT" ]; then
              if gh pr merge "$PR_NUMBER" --squash --delete-branch; then merged=true; fi
              break
            fi
            echo "Mergeability still computing (mergeable=$m state=$s); retry $attempt..."
            sleep 5
          done
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          if [ "$merged" = "true" ] || [ "$merged" = "skip" ]; then
            exit 0
          fi
          # Either a real conflict, or mergeability never settled. Hand to the
          # rebase robot; on success it re-fires ready-to-merge and we land it
          # on the next auto-merge pass. Use AGENT_PAT so the labeled event
          # actually triggers agent-update-branch.
          if [ "$rebase" = "false" ]; then
            echo "Mergeability never settled — handing to rebase robot to recompute."
          fi
          if [ -n "${AGENT_PAT:-}" ]; then
            GH_TOKEN="$AGENT_PAT" gh pr edit "$PR_NUMBER" --add-label "agent:update-branch" \
              || gh pr edit "$PR_NUMBER" --add-label "agent:update-branch"
          else
            gh pr edit "$PR_NUMBER" --add-label "agent:update-branch"
          fi
          gh pr comment "$PR_NUMBER" --body "Auto-merge couldn't fast-forward (a sibling PR likely landed first) — handed to \`agent:update-branch\` to rebase and retry automatically."

      - name: Close linked issues and promote dependents
        if: steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"

          body=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          closed_issues=$(echo "$body" | grep -oiE '(closes|fixes|resolves)\s+#[0-9]+' \
            | grep -oE '[0-9]+' || true)

          if [ -z "$closed_issues" ]; then
            echo "No linked issues found."
            exit 0
          fi

          for issue in $closed_issues; do
            state=$(gh issue view "$issue" --json state --jq '.state')
            if [ "$state" = "OPEN" ]; then
              echo "Closing #$issue"
              gh issue close "$issue" --reason completed
            fi

            # Find dependents (issues this one is blocking)
            dependents=$(gh api graphql \
              -f query='query($owner: String!, $repo: String!, $num: Int!) { repository(owner: $owner, name: $repo) { issue(number: $num) { blocking(first: 100) { nodes { number state } } } } }' \
              -f owner="$owner" -f repo="$repo" -F num="$issue" \
              --jq '[.data.repository.issue.blocking.nodes[] | select(.state == "OPEN") | .number]')

            echo "Dependents of #$issue: $dependents"

            if [ "$dependents" = "[]" ] || [ -z "$dependents" ]; then
              continue
            fi

            echo "$dependents" | jq -r '.[]' | while read -r y; do
              echo "::group::Evaluating #$y"

              y_data=$(gh api graphql \
                -f query='query($owner: String!, $repo: String!, $num: Int!) { repository(owner: $owner, name: $repo) { issue(number: $num) { labels(first: 50) { nodes { name } } parent { number } blockedBy(first: 100) { nodes { number state } } } } }' \
                -f owner="$owner" -f repo="$repo" -F num="$y")

              has_queued=$(echo "$y_data" | jq '[.data.repository.issue.labels.nodes[].name] | index("agent:queued") != null')
              has_in_progress=$(echo "$y_data" | jq '[.data.repository.issue.labels.nodes[].name] | index("agent:in-progress") != null')
              parent_num=$(echo "$y_data" | jq -r '.data.repository.issue.parent.number // empty')
              remaining_open=$(echo "$y_data" | jq '[.data.repository.issue.blockedBy.nodes[] | select(.state == "OPEN")] | length')

              if [ "$has_queued" != "true" ]; then
                echo "Skip: #$y is not agent:queued"
                echo "::endgroup::"
                continue
              fi

              if [ "$has_in_progress" = "true" ]; then
                echo "Skip: #$y is agent:in-progress"
                echo "::endgroup::"
                continue
              fi

              if [ -n "$parent_num" ]; then
                echo "Refuse: #$y is a sub-issue of #$parent_num"
                gh issue edit "$y" --remove-label "agent:queued" || true
                gh issue edit "$y" --add-label "agent:blocked" || true
                gh issue comment "$y" --body "Refused to promote: this is a sub-issue of #${parent_num}. \`agent:queued\` is not meaningful on sub-issues — label the parent PRD instead."
                echo "::endgroup::"
                continue
              fi

              if [ "$remaining_open" -gt 0 ]; then
                echo "Skip: #$y still has $remaining_open open blocker(s)"
                echo "::endgroup::"
                continue
              fi

              still_queued=$(gh issue view "$y" --json labels --jq '[.labels[].name] | index("agent:queued") != null')
              if [ "$still_queued" != "true" ]; then
                echo "Skip: #$y no longer has agent:queued (lost race)"
                echo "::endgroup::"
                continue
              fi

              echo "Promote: #$y"
              gh issue edit "$y" --remove-label "agent:queued"
              gh issue comment "$y" --body "Unblocked by #${issue} closing — promoting from \`agent:queued\` to \`agent:implement\`."

              set +e
              if [ -n "$AGENT_PAT" ]; then
                GH_TOKEN="$AGENT_PAT" gh issue edit "$y" --add-label "agent:implement"
                status=$?
                if [ "$status" -ne 0 ]; then
                  echo "AGENT_PAT add-label failed (status $status); falling back to GITHUB_TOKEN."
                  gh issue edit "$y" --add-label "agent:implement"
                fi
              else
                gh issue edit "$y" --add-label "agent:implement"
              fi
              set -e

              echo "::endgroup::"
            done
          done
