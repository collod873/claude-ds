name: Agent Update Branch
run-name: "Update branch: PR #${{ github.event.pull_request.number }}"

on:
  # pull_request_target rather than pull_request: the standard pull_request
  # trigger depends on a generated merge commit, which GitHub fails to
  # produce when the PR is out-of-date or conflicting — exactly when this
  # workflow needs to run. pull_request_target runs in the base context and
  # does not need the merge commit, so the labeled event fires reliably.
  pull_request_target:
    types: [labeled]

jobs:
  update-branch:
    if: github.event.label.name == 'agent:update-branch'
    runs-on: self-hosted
    timeout-minutes: 60
    concurrency:
      group: agent-mutate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout main (shared labels module + setup-runner action)
        uses: actions/checkout@v5
        with:
          ref: main
          # Full (non-sparse) checkout: the local composite action and the shared
          # module must both be on disk before "Setup runner" runs. A sparse
          # checkout here would leave core.sparseCheckout=on in the runner's
          # primary checkout dir, poisoning the next job's plain checkout (the
          # npm-install ENOENT from #24). "Setup runner" re-checks-out the PR head
          # over this; the extra shallow main checkout is cheap insurance.

      - name: Transition labels — remove trigger + blocked, add in-progress
        run: npx -y tsx .sandcastle/agent-workflows/shared/labels.ts start-work pr "$PR_NUMBER" update-branch

      - name: Setup runner (checkout, branch, Node 22, deps, git identity)
        uses: ./.github/actions/setup-runner
        with:
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          # update-branch.ts brings main in itself; no diff fetch needed here.
          fetch-main: "false"

      - name: Run update-branch.ts
        id: run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: npx tsx .sandcastle/agent-workflows/update-branch/update-branch.ts

      - name: Push branch (abort cleanly if non-fast-forward)
        id: push
        if: success()
        env:
          SHOULD_PUSH_FILE: ${{ runner.temp }}/should_push.txt
        run: |
          # Default to "did not push"; the re-arm step keys off this so a no-op
          # rebase never re-arms auto-merge (which would loop).
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if [ ! -f "$SHOULD_PUSH_FILE" ] || [ "$(cat "$SHOULD_PUSH_FILE")" != "true" ]; then
            echo "Nothing to push."
            exit 0
          fi
          # Lease against the SHA we checked out — fails if anything pushed
          # to the branch during our run (race detection), and tolerates
          # history-rewriting updates (rebase) when the remote is unchanged.
          # --no-verify so a local pre-push hook on the runner can't hijack the
          # push (hook stderr defeats the error classifiers below, leaving a
          # blocked PR with no reason). PR CI stays the gate.
          set +e
          git push --no-verify --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "without .workflows. permission|refusing to allow a GitHub App to create or update workflow" push_err.txt; then
              echo "Push rejected: token lacks 'workflows' permission to update .github/workflows/*. Ensure checkout uses AGENT_PAT." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during update-branch run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: success()
        env:
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        run: |
          if [ -f "$COMMENT_FILE" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"
          fi

      - name: Mark blocked on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written — check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body=$(cat <<EOF
          \`agent:update-branch\` run failed.

          **Reason:** $reason

          **Workflow run:** $RUN_URL

          Re-add \`agent:update-branch\` to retry.
          EOF
          )
          npx -y tsx .sandcastle/agent-workflows/shared/labels.ts mark-blocked pr "$PR_NUMBER" --body "$body"

      - name: Always remove in-progress label
        if: always()
        run: npx -y tsx .sandcastle/agent-workflows/shared/labels.ts finish pr "$PR_NUMBER"

      - name: Re-arm auto-merge if the PR was already approved
        if: success()
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          set -uo pipefail
          # The rebase robot is the only thing that mends a PR auto-merge gave up
          # on (sibling landed first). Auto-merge parks the approval as
          # merge-pending-update on handoff (so the PR never reads ready-to-merge
          # while it's stale/conflicting). After a clean rebase the PR is
          # mergeable again, but a force-push is not a `labeled` event — so swap
          # merge-pending-update back to ready-to-merge to emit a fresh `labeled`
          # event that re-triggers agent-auto-merge. Guard on the label so an
          # unapproved PR is never auto-merged.
          has_pending=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | index("merge-pending-update") != null')
          if [ "$has_pending" != "true" ]; then
            echo "PR #$PR_NUMBER has no parked approval (merge-pending-update) — leaving it for the normal review flow."
            exit 0
          fi
          # Only re-arm if this run actually advanced the branch. If the rebase
          # changed nothing, re-arming would reproduce the exact same merge
          # decision that handed the PR here → infinite loop. Escalate to a human
          # instead of spinning.
          if [ "$PUSHED" != "true" ]; then
            echo "Rebase was a no-op (branch already current) — not re-arming to avoid a merge loop."
            npx -y tsx .sandcastle/agent-workflows/shared/labels.ts remove-trigger-label pr "$PR_NUMBER" merge-pending-update
            npx -y tsx .sandcastle/agent-workflows/shared/labels.ts mark-blocked pr "$PR_NUMBER" --body "Auto-merge handed this PR to the rebase robot, but the branch was already up to date — nothing to rebase. Re-arming would loop, so I've stopped and marked it \`agent:blocked\`. (Usually a stale-mergeability race; re-add \`ready-to-merge\` to retry.)"
            exit 0
          fi
          npx -y tsx .sandcastle/agent-workflows/shared/labels.ts remove-trigger-label pr "$PR_NUMBER" merge-pending-update
          npx -y tsx .sandcastle/agent-workflows/shared/labels.ts add-trigger-label pr "$PR_NUMBER" ready-to-merge
          echo "Re-armed ready-to-merge on #$PR_NUMBER — auto-merge will retry the merge."
