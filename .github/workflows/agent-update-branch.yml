name: Agent Update Branch

on:
  # pull_request_target rather than pull_request: the standard pull_request
  # trigger depends on a generated merge commit, which GitHub fails to
  # produce when the PR is out-of-date or conflicting — exactly when this
  # workflow needs to run. pull_request_target runs in the base context and
  # does not need the merge commit, so the labeled event fires reliably.
  pull_request_target:
    types: [labeled]

jobs:
  update-branch:
    if: github.event.label.name == 'agent:update-branch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-mutate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Transition labels — remove trigger + blocked, add in-progress
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Ensure branch is checked out by name
        run: git checkout "$BRANCH" 2>/dev/null || git checkout -B "$BRANCH"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"

      - name: Run update-branch.ts
        id: run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: npx tsx .sandcastle/agent-workflows/update-branch/update-branch.ts

      - name: Push branch (abort cleanly if non-fast-forward)
        id: push
        if: success()
        env:
          SHOULD_PUSH_FILE: ${{ runner.temp }}/should_push.txt
        run: |
          # Default to "did not push"; the re-arm step keys off this so a no-op
          # rebase never re-arms auto-merge (which would loop).
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if [ ! -f "$SHOULD_PUSH_FILE" ] || [ "$(cat "$SHOULD_PUSH_FILE")" != "true" ]; then
            echo "Nothing to push."
            exit 0
          fi
          # Lease against the SHA we checked out — fails if anything pushed
          # to the branch during our run (race detection), and tolerates
          # history-rewriting updates (rebase) when the remote is unchanged.
          set +e
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "without .workflows. permission|refusing to allow a GitHub App to create or update workflow" push_err.txt; then
              echo "Push rejected: token lacks 'workflows' permission to update .github/workflows/*. Ensure checkout uses AGENT_PAT." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during update-branch run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: success()
        env:
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        run: |
          if [ -f "$COMMENT_FILE" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"
          fi

      - name: Mark blocked on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written — check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body "$(cat <<EOF
          \`agent:update-branch\` run failed.

          **Reason:** $reason

          **Workflow run:** $RUN_URL

          Re-add \`agent:update-branch\` to retry.
          EOF
          )"

      - name: Always remove in-progress label
        if: always()
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true

      - name: Re-arm auto-merge if the PR was already approved
        if: success()
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          set -uo pipefail
          # The rebase robot is the only thing that mends a PR auto-merge gave up
          # on (sibling landed first). After a clean rebase the PR is mergeable
          # again, but a force-push is not a `labeled` event, so nothing re-fires
          # the merge. If the PR still carries ready-to-merge (i.e. review already
          # approved it), remove+re-add it to emit a fresh `labeled` event that
          # re-triggers agent-auto-merge. Guard on the label so an unapproved PR
          # is never auto-merged.
          has_rtm=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | index("ready-to-merge") != null')
          if [ "$has_rtm" != "true" ]; then
            echo "PR #$PR_NUMBER is not ready-to-merge — leaving it for the normal review flow."
            exit 0
          fi
          # Only re-arm if this run actually advanced the branch. If the rebase
          # changed nothing, re-arming would reproduce the exact same merge
          # decision that handed the PR here → infinite loop. Escalate to a human
          # instead of spinning.
          if [ "$PUSHED" != "true" ]; then
            echo "Rebase was a no-op (branch already current) — not re-arming to avoid a merge loop."
            gh pr edit "$PR_NUMBER" --remove-label "ready-to-merge" || true
            gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
            gh pr comment "$PR_NUMBER" --body "Auto-merge handed this PR to the rebase robot, but the branch was already up to date — nothing to rebase. Re-arming would loop, so I've stopped and marked it \`agent:blocked\`. (Usually a stale-mergeability race; re-add \`ready-to-merge\` to retry.)"
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --remove-label "ready-to-merge" || true
          if [ -n "${AGENT_PAT:-}" ]; then
            GH_TOKEN="$AGENT_PAT" gh pr edit "$PR_NUMBER" --add-label "ready-to-merge" \
              || gh pr edit "$PR_NUMBER" --add-label "ready-to-merge"
          else
            gh pr edit "$PR_NUMBER" --add-label "ready-to-merge"
          fi
          echo "Re-armed ready-to-merge on #$PR_NUMBER — auto-merge will retry the merge."
