name: Release

# Tag-driven: `npm run release <bump>` pushes a v* tag and this reacts to it.
# Rebuild from the tagged tree, publish to the npm registry, then cut a
# GitHub Release with auto-generated notes (the commit log since the previous
# tag is the changelog).
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: self-hosted
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so release notes can diff from the prior tag
      - uses: actions/setup-node@v5
        with:
          # Build releases on the canonical dev Node so local dev, CI default,
          # and the published artifact agree (.nvmrc is the single source).
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  # Publish runs on a GitHub-hosted runner because npm trusted publishing
  # (OIDC, no long-lived token) does not support self-hosted runners. It
  # waits for the verify/release job so a broken tree never reaches npm.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; the bundled npm may lag.
      - run: npm install -g npm@latest
      - run: npm ci
      # Smoke the exact artifact that ships (#526): the release job above
      # tests a build on a different runner, but the tarball that reaches npm
      # is built HERE. Pack once, run the shared consumer smoke against it,
      # then publish that same file — tested and shipped bytes are identical.
      # (Publishing a tarball is compatible with OIDC trusted publishing; the
      # tarball restriction only applies to --provenance, which we disable in
      # publishConfig.)
      - name: Pack, smoke, and publish the same tarball
        run: |
          set -euo pipefail
          # `prepare` prints to stdout during pack — derive the name from the
          # version instead of capturing `npm pack` output.
          npm pack >/dev/null
          TARBALL="$PWD/claude-ds-$(node -p "require('./package.json').version").tgz"
          bash scripts/smoke-tarball.sh "$TARBALL"
          npm publish "$TARBALL"
