name: Release

# Tag-driven: `npm run release <bump>` pushes a v* tag and this reacts to it.
# Rebuild from the tagged tree, then cut a GitHub Release with auto-generated
# notes (the commit log since the previous tag is the changelog).
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: self-hosted
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so release notes can diff from the prior tag
      - uses: actions/setup-node@v5
        with:
          # Build releases on the canonical dev Node so local dev, CI default,
          # and the published artifact agree (.nvmrc is the single source).
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
