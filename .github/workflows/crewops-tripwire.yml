name: Crewops tripwire

# Issue #416 — the real-Crewops tripwire.
#
# Runs `claude-ds heal --dry-run --json` and `claude-ds doctor --json`
# against BOTH the committed Crewops-shaped fixture AND the real Crewops
# project, then compares the two `--json` envelopes via
# `.sandcastle/self-correcting-loop/check-tripwire.ts`. A divergence is
# the proxy-staleness signal — the e2e gate's green verdict no longer
# matches what real Crewops will experience.
#
# When divergence fires, the workflow auto-files an issue labeled
# `claude-ds:fixture-refresh` whose body lists every divergent field and
# points the maintainer at `docs/agents/fixture-refresh.md`. The marker
# (`<!-- claude-ds:crewops-tripwire -->`) embedded in the body lets a
# runaway be bulk-closed.
#
# Triggers:
#   - schedule: daily — early-warning, never blocks CI.
#   - workflow_dispatch — manual fire (after a fixture refresh, for example).
#
# NOT triggered on push/PR: this fires against a long-running external
# project and would create noisy gh-API churn against every PR.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  tripwire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Capture fixture payload
        # Copy the fixture to a scratch dir and run `adopt → heal --dry-run --json`
        # against it. Each payload — heal and doctor — is captured separately so
        # the tripwire script compares them field-by-field. Failures here
        # surface as workflow errors, not divergence reports — they mean the
        # fixture itself is broken.
        run: |
          set -euo pipefail
          mkdir -p /tmp/fixture-copy
          cp -r tests/e2e/fixtures/crewops-shaped/. /tmp/fixture-copy/
          pushd /tmp/fixture-copy
          node "$GITHUB_WORKSPACE/dist/cli.js" adopt --pack next-react --yes
          node "$GITHUB_WORKSPACE/dist/cli.js" heal --dry-run --json > "$GITHUB_WORKSPACE/fixture-heal.json"
          node "$GITHUB_WORKSPACE/dist/cli.js" doctor --json > "$GITHUB_WORKSPACE/fixture-doctor.json" || true
          popd

      - name: Capture real-Crewops payload
        # Clones real Crewops at HEAD, links claude-ds in, and runs
        # `heal --dry-run --json` / `doctor --json`. The runs are read-only —
        # `--dry-run` and `doctor` write no bytes to the Crewops tree. The
        # `|| true` on doctor mirrors the fixture step so a non-zero exit
        # (legitimate findings, exit 1) still produces a payload for the
        # comparison rather than failing the workflow.
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: |
          set -euo pipefail
          # If AGENT_PAT is unset (private fork, missing secret), skip the
          # tripwire rather than fail the schedule.
          if [ -z "${AGENT_PAT:-}" ]; then
            echo "::warning::AGENT_PAT unset — skipping tripwire (no access to real Crewops)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/crewops
          git clone "https://x-access-token:${AGENT_PAT}@github.com/collod873/crewops.git" /tmp/crewops
          pushd /tmp/crewops
          node "$GITHUB_WORKSPACE/dist/cli.js" heal --dry-run --json > "$GITHUB_WORKSPACE/real-heal.json" || true
          node "$GITHUB_WORKSPACE/dist/cli.js" doctor --json > "$GITHUB_WORKSPACE/real-doctor.json" || true
          popd
        id: real

      - name: Ensure tripwire label exists
        # Idempotent label-create on first fire (mirrors the pattern in
        # architecture-review.yml). Without this, `gh issue create --label
        # claude-ds:fixture-refresh` fails on the first divergence run.
        if: steps.real.outputs.skip != 'true'
        run: |
          gh label create "claude-ds:fixture-refresh" \
            --color "FBCA04" \
            --description "Fixture-refresh request auto-filed by the Crewops tripwire (issue #416)" \
            >/dev/null 2>&1 || true

      - name: Compare heal payloads
        if: steps.real.outputs.skip != 'true'
        env:
          FIXTURE_PAYLOAD: fixture-heal.json
          REAL_PAYLOAD: real-heal.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REAL_SOURCE: "real Crewops (https://github.com/collod873/crewops, HEAD)"
        run: npx tsx .sandcastle/self-correcting-loop/check-tripwire.ts

      - name: Compare doctor payloads
        if: steps.real.outputs.skip != 'true'
        env:
          FIXTURE_PAYLOAD: fixture-doctor.json
          REAL_PAYLOAD: real-doctor.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REAL_SOURCE: "real Crewops (https://github.com/collod873/crewops, HEAD)"
        run: npx tsx .sandcastle/self-correcting-loop/check-tripwire.ts

      - name: Upload tripwire payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crewops-tripwire-payloads
          path: |
            fixture-heal.json
            fixture-doctor.json
            real-heal.json
            real-doctor.json
          if-no-files-found: warn
