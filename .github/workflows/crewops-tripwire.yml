name: Crewops tripwire

# Issue #416, repurposed by PRD #439 — the Crewops snapshot-staleness tripwire.
#
# Runs `claude-ds heal --dry-run --json` and `claude-ds doctor --json`
# against BOTH the committed Crewops snapshot
# (tests/e2e/fixtures/crewops-snapshot/) AND the live Crewops project,
# then compares the two `--json` envelopes via
# `.sandcastle/self-correcting-loop/check-tripwire.ts`. A divergence is
# the snapshot-staleness signal — the committed snapshot the deterministic
# PR friction gate runs against has drifted away from live Crewops, so the
# gate's green verdict no longer matches what real Crewops will experience.
#
# The committed snapshot's SOLE failure mode is going stale; this tripwire
# is its freshness early-warning owner. The deterministic merge gate is the
# friction gate that runs against the committed snapshot on every PR — this
# tripwire never gates a PR.
#
# When divergence fires, the workflow auto-files an issue labeled
# `claude-ds:fixture-refresh` whose body lists every divergent field and
# points the maintainer at `docs/agents/fixture-refresh.md`. The marker
# (`<!-- claude-ds:crewops-tripwire -->`) embedded in the body lets a
# runaway be bulk-closed.
#
# Triggers:
#   - schedule: daily — early-warning, never blocks CI.
#   - workflow_dispatch — manual fire (after a snapshot refresh, for example).
#
# NOT triggered on push/PR: this fires against a long-running external
# project and would create noisy gh-API churn against every PR. PR-time
# determinism is the friction gate's job, not this tripwire's.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  tripwire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Capture committed-snapshot payload
        # Copy the committed snapshot to a scratch dir and run
        # `adopt → heal --dry-run --json` against it. Each payload — heal and
        # doctor — is captured separately so the tripwire script compares them
        # field-by-field. Failures here surface as workflow errors, not
        # divergence reports — they mean the committed snapshot itself is broken.
        run: |
          set -euo pipefail
          mkdir -p /tmp/snapshot-copy
          cp -r tests/e2e/fixtures/crewops-snapshot/. /tmp/snapshot-copy/
          pushd /tmp/snapshot-copy
          node "$GITHUB_WORKSPACE/dist/cli.js" adopt --pack next-react --yes
          node "$GITHUB_WORKSPACE/dist/cli.js" heal --dry-run --json > "$GITHUB_WORKSPACE/snapshot-heal.json"
          node "$GITHUB_WORKSPACE/dist/cli.js" doctor --json > "$GITHUB_WORKSPACE/snapshot-doctor.json" || true
          popd

      - name: Capture live-Crewops payload
        # Clones live Crewops at HEAD, links claude-ds in, and runs
        # `heal --dry-run --json` / `doctor --json`. The runs are read-only —
        # `--dry-run` and `doctor` write no bytes to the Crewops tree. The
        # `|| true` on doctor mirrors the snapshot step so a non-zero exit
        # (legitimate findings, exit 1) still produces a payload for the
        # comparison rather than failing the workflow.
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: |
          set -euo pipefail
          # If AGENT_PAT is unset (private fork, missing secret), skip the
          # tripwire rather than fail the schedule.
          if [ -z "${AGENT_PAT:-}" ]; then
            echo "::warning::AGENT_PAT unset — skipping tripwire (no access to real Crewops)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/crewops
          git clone "https://x-access-token:${AGENT_PAT}@github.com/collod873/crewops.git" /tmp/crewops
          pushd /tmp/crewops
          node "$GITHUB_WORKSPACE/dist/cli.js" heal --dry-run --json > "$GITHUB_WORKSPACE/real-heal.json" || true
          node "$GITHUB_WORKSPACE/dist/cli.js" doctor --json > "$GITHUB_WORKSPACE/real-doctor.json" || true
          popd
        id: real

      - name: Ensure tripwire label exists
        # Idempotent label-create on first fire (mirrors the pattern in
        # architecture-review.yml). Without this, `gh issue create --label
        # claude-ds:fixture-refresh` fails on the first divergence run.
        if: steps.real.outputs.skip != 'true'
        run: |
          gh label create "claude-ds:fixture-refresh" \
            --color "FBCA04" \
            --description "Fixture-refresh request auto-filed by the Crewops tripwire (issue #416)" \
            >/dev/null 2>&1 || true

      - name: Compare heal payloads
        if: steps.real.outputs.skip != 'true'
        env:
          SNAPSHOT_PAYLOAD: snapshot-heal.json
          REAL_PAYLOAD: real-heal.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REAL_SOURCE: "live Crewops (https://github.com/collod873/crewops, HEAD)"
        run: npx tsx .sandcastle/self-correcting-loop/check-tripwire.ts

      - name: Compare doctor payloads
        if: steps.real.outputs.skip != 'true'
        env:
          SNAPSHOT_PAYLOAD: snapshot-doctor.json
          REAL_PAYLOAD: real-doctor.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REAL_SOURCE: "live Crewops (https://github.com/collod873/crewops, HEAD)"
        run: npx tsx .sandcastle/self-correcting-loop/check-tripwire.ts

      - name: Upload tripwire payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crewops-tripwire-payloads
          path: |
            snapshot-heal.json
            snapshot-doctor.json
            real-heal.json
            real-doctor.json
          if-no-files-found: warn
