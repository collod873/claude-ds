name: Install Smoke

# Exercise the literal consumer install path. Source-tree CI runs tests
# against src/, but consumers install the packed tarball — the only artifact
# where the `files` allowlist applies. A runtime file missing from that
# allowlist (pack manifest, pack files) passes every unit test and still
# breaks every consumer, so install from the tarball exactly like npm would
# and run a real command. See #477.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Pack tarball and install in a scratch consumer repo
        run: |
          set -euo pipefail
          EXPECTED="v$(node -p "require('./package.json').version")"
          echo "checkpoint: expecting $EXPECTED"

          npm ci
          TARBALL="$PWD/$(npm pack --silent)"
          echo "checkpoint: packed $TARBALL"

          SCRATCH=$(mktemp -d)
          # Fresh npm cache: the self-hosted runner's persistent cache must not
          # be able to satisfy the install with a previously built copy.
          export npm_config_cache=$(mktemp -d)
          trap 'rm -rf "$SCRATCH" "$npm_config_cache" "$TARBALL"' EXIT

          git -C "$SCRATCH" init -q
          printf '{"name":"scratch-consumer","private":true}\n' > "$SCRATCH/package.json"
          cd "$SCRATCH"
          echo "checkpoint: scratch consumer repo ready"

          npm install --no-save "$TARBALL"
          GOT=$(npx --no-install claude-ds -V)
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "FAIL: version mismatch — got '$GOT', expected '$EXPECTED'"
            exit 1
          fi
          echo "OK: CLI ran from tarball install and printed $GOT"

          # One representative real command: init reads the pack manifest and
          # copies pack files out of the installed package, so a runtime file
          # missing from the `files` allowlist fails here.
          npx --no-install claude-ds init --pack next-react --yes
          if [ ! -f .claude-ds.json ]; then
            echo "FAIL: init exited 0 but wrote no .claude-ds.json"
            exit 1
          fi
          echo "OK: init scaffolded the scratch project"

          # Never-break-a-consumer: installing the package must NOT touch the
          # consumer repo's git config (tarball installs don't run `prepare`,
          # and this proves it stays that way).
          if HOOKSPATH=$(git config core.hookspath); then
            echo "FAIL: install set consumer core.hookspath to '$HOOKSPATH'"
            exit 1
          fi
          echo "OK: consumer core.hookspath untouched"
