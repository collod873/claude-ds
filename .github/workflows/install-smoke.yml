name: Install Smoke

# Exercise the literal consumer install path. Source-tree CI runs tests
# against src/, but consumers install the packed tarball — the only artifact
# where the `files` allowlist applies. A runtime file missing from that
# allowlist (pack manifest, pack files) passes every unit test and still
# breaks every consumer, so install from the tarball exactly like npm would
# and run a real command. See #477.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    # Skip on agent PRs — the merge push to main re-runs it minutes later, and
    # the release path runs the identical smoke (#526), so consumers stay
    # covered (#602). Job-level `if:` (not a trigger-level branches filter) so
    # a skipped run still reports a check, which satisfies the ruleset; with no
    # check run at all the PR would pend forever. head_ref is empty on push.
    if: ${{ !startsWith(github.head_ref, 'agent/') }}
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # The smoke itself lives in scripts/smoke-tarball.sh so the release
      # publish job runs the identical checks against the artifact it ships
      # (#526) — edit the script, not this step, to deepen the smoke.
      - name: Pack tarball and smoke it in a scratch consumer repo
        run: |
          set -euo pipefail
          npm ci
          # Don't capture `npm pack` stdout: the `prepare` lifecycle (hook
          # installer) prints to stdout and corrupts the captured filename.
          # The tarball name is deterministic from the version instead.
          npm pack >/dev/null
          TARBALL="$PWD/claude-ds-$(node -p "require('./package.json').version").tgz"
          trap 'rm -f "$TARBALL"' EXIT
          bash scripts/smoke-tarball.sh "$TARBALL"
