name: Agent Implement PRD
run-name: "Implement PRD: fan-out #${{ github.event.issue.number }}"

# Dependency-aware fan-out dispatcher. When a PRD (an issue that has sub-issues)
# is labeled `agent:implement`, this promotes every open sub-issue that has zero
# OPEN blockers (native GitHub blocked-by relations) to `agent:implement` so
# `agent-implement.yml` picks each up and implements it in parallel — one branch
# and one PR per sub-issue. Blocked sub-issues are parked as `agent:queued`;
# agent-promote-queued.yml releases each as its last open blocker closes
# (wave-based parallelism). The PRD itself implements nothing; it moves to
# `agent:in-progress` and closes automatically once its last sub-issue closes
# (see agent-close-completed-prd.yml).
#
# Replaces the previous sequential model, where this workflow implemented one
# sub-issue per run and re-labelled itself to march through the rest serially.

on:
  issues:
    types: [labeled]

jobs:
  fan-out:
    if: github.event.label.name == 'agent:implement'
    runs-on: self-hosted
    timeout-minutes: 10
    concurrency:
      group: agent-implement-prd-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write

    env:
      PRD_NUMBER: ${{ github.event.issue.number }}
      PRD_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # AGENT_PAT is required so the `agent:implement` labels we add to
      # sub-issues fire agent-implement.yml — labels added via GITHUB_TOKEN do
      # not trigger downstream workflows. Falls back to GITHUB_TOKEN, in which
      # case the labels land but a human must re-add them to start the runs.
      AGENT_PAT: ${{ secrets.AGENT_PAT }}

    steps:
      - name: Checkout main (for the shared labels module)
        uses: actions/checkout@v5
        with:
          ref: main
          # Check the shared module out to a SEPARATE path so the sparse config
          # lives in _shared/.git, never the runner's primary checkout dir. A
          # sparse main checkout here used to leave core.sparseCheckout=on behind,
          # poisoning the next job's plain checkout (npm install ENOENT). See #24.
          path: _shared
          sparse-checkout: .sandcastle/agent-workflows/shared
          sparse-checkout-cone-mode: false

      - name: Detect — sub-issues + parent shape
        id: shape
        run: |
          set -euo pipefail
          sub_issues_json=$(gh api "repos/${GH_REPO}/issues/${PRD_NUMBER}/sub_issues" 2>/dev/null || echo "[]")
          sub_count=$(echo "$sub_issues_json" | jq 'length')
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"
          parent_number=$(gh api graphql \
            -f query='query($owner: String!, $repo: String!, $num: Int!) { repository(owner: $owner, name: $repo) { issue(number: $num) { parent { number } } } }' \
            -f owner="$owner" -f repo="$repo" -F num="$PRD_NUMBER" \
            --jq '.data.repository.issue.parent.number // empty' 2>/dev/null || echo "")

          # Reject nested PRDs: a PRD with sub-issues that itself has a parent.
          nested="false"
          if [ "$sub_count" != "0" ] && [ -n "$parent_number" ]; then
            nested="true"
          fi

          # Reject if any sub-issue has its own sub-issues (v1 is flat-only).
          has_nested_child="false"
          if [ "$sub_count" != "0" ]; then
            for child_num in $(echo "$sub_issues_json" | jq -r '.[].number'); do
              child_sub_count=$(gh api "repos/${GH_REPO}/issues/${child_num}/sub_issues" --jq 'length' 2>/dev/null || echo "0")
              if [ "$child_sub_count" != "0" ]; then
                has_nested_child="true"
                echo "nested_child_number=$child_num" >> "$GITHUB_OUTPUT"
                break
              fi
            done
          fi

          # All still-open sub-issue numbers, space-separated.
          open_subs=$(echo "$sub_issues_json" | jq -r '[.[] | select(.state == "open") | .number] | join(" ")')

          # Decide proceed and refuse reasons.
          if [ "$sub_count" = "0" ]; then
            mode="silent"   # Not a PRD; single-issue workflow handles it.
          elif [ "$nested" = "true" ]; then
            mode="refuse-nested-prd"
          elif [ "$has_nested_child" = "true" ]; then
            mode="refuse-nested-child"
          elif [ -z "$open_subs" ]; then
            mode="refuse-all-closed"
          else
            mode="run"
          fi

          echo "sub_count=$sub_count" >> "$GITHUB_OUTPUT"
          echo "parent_number=$parent_number" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "open_subs=$open_subs" >> "$GITHUB_OUTPUT"

      - name: Refuse — nested PRD
        if: steps.shape.outputs.mode == 'refuse-nested-prd'
        env:
          PARENT_NUMBER: ${{ steps.shape.outputs.parent_number }}
        run: |
          npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts remove-trigger-label issue "$PRD_NUMBER" implement
          npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts mark-blocked issue "$PRD_NUMBER" --body "Refused to run: this issue has sub-issues but is itself a sub-issue of #${PARENT_NUMBER}. Nested PRDs are not supported in v1. Flatten the structure before retrying."

      - name: Refuse — sub-issue has its own sub-issues
        if: steps.shape.outputs.mode == 'refuse-nested-child'
        env:
          NESTED_CHILD: ${{ steps.shape.outputs.nested_child_number }}
        run: |
          npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts remove-trigger-label issue "$PRD_NUMBER" implement
          npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts mark-blocked issue "$PRD_NUMBER" --body "Refused to run: sub-issue #${NESTED_CHILD} itself has sub-issues. Nested sub-issues are not supported in v1 — each sub-issue must be a leaf. Flatten the structure before retrying."

      - name: Refuse — all sub-issues already closed
        if: steps.shape.outputs.mode == 'refuse-all-closed'
        run: |
          npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts remove-trigger-label issue "$PRD_NUMBER" implement
          npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts mark-blocked issue "$PRD_NUMBER" --body "Refused to run: all sub-issues are already closed; nothing to implement. If you want to do more work on this PRD, reopen or add a sub-issue first."

      - name: Fan out — promote unblocked sub-issues, queue the rest
        if: steps.shape.outputs.mode == 'run'
        env:
          OPEN_SUBS: ${{ steps.shape.outputs.open_subs }}
        run: |
          set -euo pipefail
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"

          # The PRD is the dispatcher — it implements nothing. Move it to
          # in-progress so it reads as "work underway" while sub-issue PRs land.
          npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts start-work issue "$PRD_NUMBER" implement

          # Dependency-aware fan-out: a sub-issue runs now only if it
          # has zero OPEN blockers (native GitHub blocked-by relations). Blocked
          # sub-issues are parked as agent:queued; agent-promote-queued.yml
          # releases each as its last open blocker closes (wave-based parallelism).
          promoted=0
          queued=0
          for sub in $OPEN_SUBS; do
            open_blockers=$(gh api graphql \
              -f query='query($owner: String!, $repo: String!, $num: Int!) { repository(owner: $owner, name: $repo) { issue(number: $num) { blockedBy(first: 100) { nodes { number state } } } } }' \
              -f owner="$owner" -f repo="$repo" -F num="$sub" \
              --jq '[.data.repository.issue.blockedBy.nodes[] | select(.state == "OPEN")] | length' 2>/dev/null || echo "0")

            if [ "$open_blockers" -gt 0 ]; then
              echo "Queuing sub-issue #$sub ($open_blockers open blocker(s))"
              npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts mark-queued issue "$sub"
              queued=$((queued + 1))
              continue
            fi

            echo "Promoting sub-issue #$sub (unblocked)"
            npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts add-trigger-label issue "$sub" implement
            promoted=$((promoted + 1))
          done

          gh issue comment "$PRD_NUMBER" --body "Fanned out — promoted ${promoted} unblocked sub-issue(s) to \`agent:implement\`, parked ${queued} blocked sub-issue(s) as \`agent:queued\`. Unblocked work runs in parallel now; each queued sub-issue is released as its last open blocker closes. This PRD closes automatically when the last sub-issue closes."

      - name: Mark blocked on failure
        if: steps.shape.outputs.mode == 'run' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts finish issue "$PRD_NUMBER"
          body=$(cat <<EOF
          \`agent:implement\` (PRD fan-out) failed before all sub-issues were promoted.

          **Workflow run:** $RUN_URL

          Remove \`agent:blocked\` and re-add \`agent:implement\` to retry. Promotion is idempotent — already-labelled sub-issues are skipped.
          EOF
          )
          npx -y tsx _shared/.sandcastle/agent-workflows/shared/labels.ts mark-blocked issue "$PRD_NUMBER" --body "$body"
