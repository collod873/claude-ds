name: e2e-smoke

# Blocking inner-loop gate for PRD #407 (issue #415).
# Runs the real built CLI (`node dist/cli.js`) against the committed
# Crewops-shaped fixture, then publishes `e2e-report.json` as an artifact.
#
# Until #414/A1–A3 landed this job was a non-blocking discovery catalogue
# (`continue-on-error: true`). Issue #415 flips it to a hard PR gate now that
# the harness's green invariant can actually be met — a regression that
# resurrects the duplicate `export const meta` shape, drops a managed
# scaffold file, or breaks `adopt → write `.claude-ds.json`` fails the gate
# instead of waiting for a tag-cut to discover it (PRD #407 user story 17).
#
# Hard time budget: `timeout-minutes` keeps this in the fast inner loop
# (single-digit minutes — PRD #407 user story 27). The heavy per-command /
# multi-fixture matrix lives in `e2e-release.yml` (nightly + tag push), not
# here, so the inner loop stays fast as more fixtures land.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    # Inner-loop budget — every step has to finish well under this. If a step
    # newly bloats the gate past single-digit minutes, this fails loudly
    # rather than letting the gate quietly creep into 15+ minute territory.
    timeout-minutes: 8
    # The self-correcting loop step (issue #416) creates issues, comments on
    # the PR, and toggles `agent:blocked` on escalation. Without explicit
    # write scopes here GITHUB_TOKEN falls back to read-only on PRs and the
    # follow-up step would 403. Read-only by default for everything else.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Run e2e smoke harness + friction gate
        # No `continue-on-error` — a red smoke harness OR a friction regression
        # fails the PR gate. The smoke harness emits `e2e-report.json` for the
        # artifact step below; the friction gate (PRD #439, issue #439)
        # reconciles the real CLI's rendered output against
        # `tests/e2e/friction-baseline.json` and fails on any finding NOT in the
        # baseline — wired here into the BLOCKING smoke tier (#415) so friction
        # is checked on every PR, not nightly. Reproduce locally with
        # `npm run e2e:friction`. Non-zero vitest exit is the blocking signal.
        run: npx vitest run tests/e2e/smoke.test.ts tests/e2e/friction.test.ts

      - name: Upload smoke report
        # `if: always()` so a failing run still uploads the report — the
        # artifact is the debugging surface for whatever broke the gate.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-report.json
          if-no-files-found: warn

      - name: Self-correcting loop — file follow-up from red gate (issue #416)
        # When the smoke gate goes red on a PR, route the harness output
        # through the self-correcting loop module so breakage strings new
        # work into GitHub automatically instead of dead-ending. The module
        # dedupes against the existing auto-filed queue, escalates clusters
        # to a PRD, and stops + escalates to Collin after N=2 consecutive
        # unproductive rounds (acceptance criteria, PRD #407).
        #
        # Gates on `failure()` so a green gate never spawns issue churn,
        # and on `pull_request` so a red `push` to main (which has its own
        # release-issue path in auto-tag.yml) doesn't double-file.
        if: failure() && github.event_name == 'pull_request' && hashFiles('e2e-report.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HARNESS_REPORT: e2e-report.json
          SOURCE_PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Ensure the auto-filed label exists on first fire (mirrors the
          # idempotent label-create pattern in architecture-review.yml).
          # Without this, `gh issue create --label claude-ds:auto-filed`
          # fails with "label does not exist" on the first run after this
          # workflow lands.
          gh label create "claude-ds:auto-filed" \
            --color "D93F0B" \
            --description "Auto-filed by the self-correcting loop (issue #416)" \
            >/dev/null 2>&1 || true
          npx tsx .sandcastle/self-correcting-loop/file-followup.ts
