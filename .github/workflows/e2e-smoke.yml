name: e2e-smoke

# Blocking inner-loop gate for PRD #407 (issue #415).
# Runs the real built CLI (`node dist/cli.js`) against the committed
# Crewops-shaped fixture, then publishes `e2e-report.json` as an artifact.
#
# Until #414/A1–A3 landed this job was a non-blocking discovery catalogue
# (`continue-on-error: true`). Issue #415 flips it to a hard PR gate now that
# the harness's green invariant can actually be met — a regression that
# resurrects the duplicate `export const meta` shape, drops a managed
# scaffold file, or breaks `adopt → write `.claude-ds.json`` fails the gate
# instead of waiting for a tag-cut to discover it (PRD #407 user story 17).
#
# Hard time budget: `timeout-minutes` keeps this in the fast inner loop
# (single-digit minutes — PRD #407 user story 27). The heavy per-command /
# multi-fixture matrix lives in `e2e-release.yml` (nightly + tag push), not
# here, so the inner loop stays fast as more fixtures land.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    # Inner-loop budget — every step has to finish well under this. If a step
    # newly bloats the gate past single-digit minutes, this fails loudly
    # rather than letting the gate quietly creep into 15+ minute territory.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Run e2e smoke harness
        # No `continue-on-error` — a red smoke harness fails the PR gate.
        # The harness still emits `e2e-report.json` for the artifact step
        # below; non-zero vitest exit is the blocking signal.
        run: npx vitest run tests/e2e/smoke.test.ts

      - name: Upload smoke report
        # `if: always()` so a failing run still uploads the report — the
        # artifact is the debugging surface for whatever broke the gate.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-report.json
          if-no-files-found: warn
