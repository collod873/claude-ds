name: auto-tag

# Bumping `version` in `package.json` IS the release action.
#
# On every push to `main`:
#   1. Read `version` from `package.json` (cheap, ~2s).
#   2. If tag `v<version>` already exists → no-op. Most pushes hit this path.
#   3. If the tag is missing → this is a release:
#      - ADR-0011 verification gate: migration-bearing releases
#        (`src/lib/ops/migrations/v<v>/` present) refuse to tag until
#        `pack/versions/<v>/verification.md` exists.
#      - Test gate: `npm test` must pass.
#      - Create + push the annotated tag.
#      - Cut a GitHub Release using the matching `## [x.y.z]` CHANGELOG section.
#      - Re-pin the README install examples to the new tag and push to `main`
#        (that push re-triggers this workflow, which no-ops since the tag now
#        exists). README pinning used to be a hand-driven post-release commit
#        that silently went stale a version behind (#383).
#
# Net effect: a forgotten tag is no longer possible, the README install command
# can't lag the release, and a migration-bearing release without Crewops
# verification is mechanically refused (ADR-0011 + 0002).
#
# If any release-path step that can hard-fail (test gate, ADR-0011 gate,
# tag-push, README-pin) fails, the workflow opens a GitHub issue with a link
# to the failing run — silent red runs are #383's other half. The no-op
# re-trigger path can't fire that step (its guard requires `exists == 'false'`).
# `GitHub Release from CHANGELOG` deliberately swallows its error into a
# workflow warning so the README-pin step still runs (the tag is already the
# canonical release artifact); a Release-create hiccup therefore stays as a
# log-only warning, not an issue.

on:
  push:
    branches: [main]

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version (tag v$version)."

      - name: Check existing tag
        id: check
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists — no-op."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $tag missing — this is a release."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ADR-0011 verification gate
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mig_dir="src/lib/ops/migrations/v$version"
          verif_file="pack/versions/$version/verification.md"
          if [ -d "$mig_dir" ]; then
            echo "Release v$version carries migrations ($mig_dir present)."
            if [ ! -s "$verif_file" ]; then
              echo "::error::Refusing to tag v$version: migration-bearing release without a filled $verif_file."
              echo "::error::Per ADR-0011, run \`claude-ds upgrade\` against Crewops, record the result in $verif_file, commit, then re-push."
              exit 1
            fi
            echo "Verification note present at $verif_file — gate satisfied."
          else
            echo "Release v$version is non-migration (no $mig_dir) — clean CI/audit is sufficient proof (ADR-0011 addendum)."
          fi

      - name: Setup Node
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.check.outputs.exists == 'false'
        # `npm ci` runs the `prepare` script (`npm run build`) which produces
        # `dist/cli.js`. That output is required by the e2e smoke harness
        # (`tests/e2e/smoke.test.ts`) — without it the harness auto-skips on
        # the missing CLI guard and the release gate would silently lose its
        # blocking e2e coverage (issue #415).
        run: npm ci

      - name: Build CLI (explicit — required by smoke e2e in test gate)
        if: steps.check.outputs.exists == 'false'
        # Belt-and-suspenders for the dist dependency above. `prepare` already
        # built dist during `npm ci`, but pinning it as its own step means a
        # future package.json refactor that drops `prepare` cannot silently
        # convert the smoke gate into a skip on the release path (issue #415,
        # PRD #407 user story 17).
        run: npm run build

      - name: Test gate (includes smoke e2e — release blocked on red smoke)
        if: steps.check.outputs.exists == 'false'
        # `npm test` is `vitest run`, which runs every test file under
        # `tests/**/*.test.ts` — including `tests/e2e/smoke.test.ts`. A red
        # smoke harness therefore mechanically fails this step, preventing
        # `Tag and push` below from firing on a release where a
        # representative consumer ends up broken (PRD #407 user story 17,
        # issue #415).
        run: npm test

      - name: Tag and push
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "Tagged and pushed $tag from $(git rev-parse HEAD)."

      - name: GitHub Release from CHANGELOG
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          # Extract the body between `## [<version>]` and the next `## [` header.
          body=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]"                  { capture=1; next }
            capture && /^## \[[0-9]+\.[0-9]+\.[0-9]+/ { exit }
            capture                                    { print }
          ' CHANGELOG.md)
          # Trim leading/trailing blank lines.
          body=$(printf '%s\n' "$body" | awk 'NF{f=1} f' | awk '{ a[NR]=$0 } END { for (i=NR; i>0; i--) if (a[i] != "") { last=i; break } for (i=1; i<=last; i++) print a[i] }')
          if [ -z "$body" ]; then
            body="No changelog entry found for $version."
          fi
          gh release create "$tag" --title "$tag" --notes "$body" \
            || echo "::warning::\`gh release create\` failed — the tag pushed, but the Release was not cut. Create it manually if needed."

      - name: Pin README install examples to release version
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          # The README hardcodes the pinned install tag (`...claude-ds#vX.Y.Z`).
          # Bumping `version` in package.json doesn't touch it, so it silently
          # lagged a release behind, pointing consumers at the previous tag
          # (#383). Re-pin it here, after the tag exists. The semver-anchored
          # pattern leaves the version-less `#main` dev/preview line untouched.
          sed -i -E "s|claude-ds#v[0-9]+\.[0-9]+\.[0-9]+|claude-ds#${tag}|g" README.md
          if git diff --quiet -- README.md; then
            echo "README already pinned to $tag — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: pin README install examples to $tag"
          # Re-triggers this workflow; it no-ops because the tag now exists.
          git push origin HEAD:main
          echo "Re-pinned README to $tag and pushed to main."

      - name: Open release-failure issue on any prior step failure
        # Fires when this run attempted a release (steps.check.outputs.exists
        # was 'false') and any prior step hard-failed — test gate, ADR-0011
        # gate, tag-push, or README-pin. (The `GitHub Release from CHANGELOG`
        # step intentionally swallows its error to a `::warning::` so README-
        # pin still runs; that path stays as a log-only warning, not an issue.)
        # The pre-#383 behaviour was a silent red workflow run that nobody saw
        # until the next release noticed `main` hadn't moved. Opening a GitHub
        # issue surfaces the failure on the maintainer's radar without needing
        # email/Slack wiring.
        #
        # On the post-release re-trigger run (after the README-pin push), the
        # check step succeeds (tag now exists), nothing else runs, failure()
        # stays false — so this step does NOT fire on no-op re-triggers.
        if: failure() && steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          short_sha="${GITHUB_SHA:0:7}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title="release: auto-tag failed for ${tag} (${short_sha})"
          body=$(cat <<EOF
          \`auto-tag.yml\` failed during a release attempt.

          - **Intended tag**: \`${tag}\`
          - **Version**: \`${version}\`
          - **Commit**: \`${GITHUB_SHA}\`
          - **Workflow run**: ${run_url}

          Likely cause: the test gate or ADR-0011 verification gate failed before \`Tag and push\`. Open the run log, fix forward on \`main\`, and push again — \`auto-tag.yml\` will retry on the next push.

          Auto-opened by \`.github/workflows/auto-tag.yml\` (#383). Close when fixed.
          EOF
          )
          # If the issue can't be opened (transient API hiccup, permission
          # drift), surface a workflow warning instead of swallowing the
          # error — better noisy than silent (the whole point of this step).
          gh issue create --title "$title" --body "$body" \
            || echo "::warning::\`gh issue create\` failed — auto-tag failure was not surfaced as an issue. Check the run log directly: ${run_url}"
