name: CI

# Safety net: main takes direct commits and there is no other gate before a
# consumer's `npx` pulls a tag. Verify every push to main and every PR.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: self-hosted
    strategy:
      # Test every Node major inside the engines range (>=22.6 — the pack's
      # hooks/scripts hard-require `node --experimental-strip-types`, which
      # Node 20 doesn't have): the floor major and the current LTS (.nvmrc
      # pins 24 for dev/release).
      # fail-fast off so one version's failure doesn't hide the other's result.
      # No max-parallel cap: the old flake it guarded against (5s vitest
      # timeouts under concurrent-job load) was addressed at the root —
      # in-process CLI runner + 30s testTimeout (see vitest.config.ts, #487).
      fail-fast: false
      matrix:
        node-version: [22, 24]
    name: ci (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
