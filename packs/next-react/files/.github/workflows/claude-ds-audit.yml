name: claude-ds audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install claude-ds
        run: npm install -g github:collod873/claude-ds

      - name: Run audit
        run: claude-ds audit
